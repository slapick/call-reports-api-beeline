# Тесты, проверка коннектора (infopanel-connect check) и сборка Docker-образа.
name: CI

on:
  push:
  pull_request:

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  # SDK infopanel-connect — из Package Registry проекта connector-sdk.
  PIP_INDEX_URL: https://gitlab.itgrn.ru/api/v4/projects/infopanel%2Fconnector-sdk/packages/pypi/simple
  PIP_EXTRA_INDEX_URL: https://pypi.org/simple

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -q -r requirements-dev.txt
      - run: pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t call-reports-api-beeline .
      # Без токена АТС проходит только объявление коннектора (manifest,
      # entities, describe); выгрузку проверяют тесты с подменой API.
      - name: Коннектор загружается в образе
        run: docker run --rm call-reports-api-beeline python -c "import beeline_connector; from infopanel_connect.model import validate_connector; validate_connector(beeline_connector.BeelineConnector())"
